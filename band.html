<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Band view</title>
  <style>
    :root { --bg: #f6f5f2; --card: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0da; --accent: #e8623a; --chip: #f0eee9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141416; --card: #1e1e21; --ink: #f2f2f3; --muted: #9a9aa0; --line: #2e2e33; --accent: #f07a52; --chip: #29292d; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 16px 16px 40px; }
    h1 { font-size: 20px; margin: 0 0 2px; }
    .lead { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    select, button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    label.chk { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
    label.pick { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
    label.pick select { padding: 5px 8px; font-size: 13px; }
    .screen { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
    #stage { display: block; width: 100%; aspect-ratio: 350 / 180; image-rendering: pixelated; }
    .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; padding: 8px 12px; color: #fff; font: 600 13px/1.2 ui-monospace, Menlo, Consolas, monospace; text-shadow: 0 1px 0 #000; pointer-events: none; }
    .lyric { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: rgba(255,255,255,.55); font: 700 clamp(13px, 2.4vw, 20px)/1.2 ui-monospace, Menlo, Consolas, monospace; text-shadow: 0 2px 0 #000; pointer-events: none; padding: 0 12px; }
    .lyric b { color: #fff; }
    .banner { position: absolute; left: 0; right: 0; top: 22%; text-align: center; color: #fff; font: 800 clamp(18px, 5vw, 40px)/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 3px 0 #000, 0 0 18px rgba(232, 98, 58, .7); opacity: 0; pointer-events: none; }
    .banner.show { animation: banner 1.6s ease-out forwards; }
    @keyframes banner { 0% { opacity: 0; transform: scale(1.3); } 12% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .banner.show { animation: none; opacity: 0; } }
    /* (not shown for now: the section's name and its banner) */
    #banner, #sect { display: none; }
    #check { display: block; width: 100%; height: 150px; margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    .status { color: var(--muted); font-size: 13px; min-height: 18px; }
    .slider { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
    .slider input { width: 120px; accent-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Band view</h1>
    <p class="lead">Prototype: a generated track played by a pixel band. Placeholder sprites; the playing is read off the music.</p>
    <div class="row">
      <select id="genre"></select>
      <button id="gen">New song</button>
      <button id="play" class="primary" disabled>Play</button>
      <select id="from" title="Start from"></select>
      <label class="chk"><input type="checkbox" id="walkon" checked /> Walk-on</label>
      <label class="chk"><input type="checkbox" id="sing" checked /> Singer</label>
      <label class="chk"><input type="checkbox" id="checkview" checked /> Check view</label>
      <label class="slider">Delay <input type="range" id="delay" min="0" max="400" step="10" value="0" /> <span id="dv">0 ms</span></label>
    </div>
    <div class="row" id="videorow">
      <button id="video" disabled>Render video</button>
      <select id="vsize" title="Video size"><option value="720">720p</option><option value="360">360p</option></select>
      <label class="chk"><input type="checkbox" id="vlyrics" checked /> Lyrics on video</label>
      <button id="vcancel" hidden>Cancel</button>
    </div>
    <div class="row" id="cast"></div>
    <div class="status" id="castwhy"></div>
    <div class="status" id="status">Loading…</div>
    <div class="screen">
      <canvas id="stage" width="350" height="180"></canvas>
      <div class="hud"><span id="sect"></span><span id="info"></span></div>
      <div class="banner" id="banner"></div>
      <div class="lyric" id="lyric"></div>
    </div>
    <canvas id="check"></canvas>
  </main>
  <script type="module" src="/src/band/main.ts"></script>
</body>
</html>
